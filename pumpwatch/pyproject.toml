[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pumpwatch"
version = "0.1.0"
description = "NSE Pump-and-Dump Stock Screening Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.24",
    "rich>=13.0",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pumpwatch*"]
